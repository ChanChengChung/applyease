server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Match the backend's maximum document upload size at the edge, so an
    # oversized/slow request cannot consume application memory first.
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    # Bound a single client before it can occupy all worker connections. The
    # value permits normal concurrent asset/API loading but curbs slow-client
    # and connection-exhaustion attacks at the public relay.
    limit_conn connections_per_client 20;
    limit_conn_status 429;
    limit_req_status 429;
    # Authentication links use URL fragments, but never retain a request URL
    # in frontend logs as an additional privacy boundary.
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; media-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Caddy is intentionally not connected to the app network. Relay public
    # readiness probes through this frontend so they still verify FastAPI,
    # PostgreSQL and migrations rather than a static Nginx response.
    location ^~ /health/ {
        # Backend owns API health security headers. A child add_header disables
        # the static-site header inheritance, avoiding conflicting CSP values.
        add_header Content-Security-Policy "" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location ^~ /api/ {
        # FastAPI owns API security headers; do not layer the UI CSP onto it.
        add_header Content-Security-Policy "" always;
        # General API budget: one sustained request per second with a short
        # burst for normal page hydration. Expensive AI routes also retain
        # their stricter account-level PostgreSQL quota in FastAPI.
        limit_req zone=api_per_client burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # Local/remote LLM generation can legitimately take longer than a
        # regular API call; still bound an unavailable upstream response.
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        # Caddy is the sole public edge and overwrites these headers with the
        # actual peer; do not replace them with Caddy's Docker IP.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Authentication endpoints are a favourite credential-stuffing and email
    # enumeration target. Keep a separate tighter IP budget in front of the
    # account/email-aware limits enforced by FastAPI.
    location ^~ /api/v1/auth/ {
        add_header Content-Security-Policy "" always;
        limit_req zone=auth_per_client burst=15 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Hashed Vite assets are immutable; cache them aggressively. HTML route
    # responses below are intentionally revalidated after each deployment.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
