server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Mirror production's edge boundary during local Docker use.
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn connections_per_client 20;
    limit_conn_status 429;
    limit_req_status 429;
    # Keep local logs free of query-string content as well. API error and
    # container health logs remain available through the backend/container.
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Production API calls use the same origin (/api); loopback is retained
    # solely for the local Docker/Vite development stack. Do not allow an
    # arbitrary HTTPS connect-src, which would weaken the XSS containment.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000; object-src 'none'; media-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Keep local frontend health routes consistent with the production relay.
    location ^~ /health/ {
        add_header Content-Security-Policy "" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # In production, the browser calls the API through the same HTTPS origin.
    # This keeps session cookies same-site and avoids exposing the API port.
    location ^~ /api/ {
        add_header Content-Security-Policy "" always;
        limit_req zone=api_per_client burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy is the only public entry point and overwrites this header with
        # the client-facing scheme. Preserve it for FastAPI HTTPS enforcement.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location ^~ /api/v1/auth/ {
        add_header Content-Security-Policy "" always;
        limit_req zone=auth_per_client burst=15 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Vite fingerprints these files. They are safe to cache for a long time,
    # while HTML routes below deliberately remain revalidatable after deploys.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        # Do not let a browser keep an old HTML entry point that references
        # chunks removed by the next deployment. `expires -1` emits a no-cache
        # response without overriding the security headers declared above.
        expires -1;
        try_files $uri /index.html;
    }
}
