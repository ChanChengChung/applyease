# Shared Nginx process configuration for the development and production
# frontend images.  Request-rate zones must live in the `http` context (not a
# virtual-host file), so keeping this file explicit prevents a future image
# change from silently dropping the public API abuse controls.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Caddy overwrites X-Real-IP at the only public edge. The frontend is not
    # published directly in production, so this gives every real client an
    # independent budget instead of treating the Caddy container as one IP.
    # The development configuration supplies the direct peer address instead.
    limit_req_zone $http_x_real_ip zone=api_per_client:10m rate=60r/m;
    limit_req_zone $http_x_real_ip zone=auth_per_client:10m rate=10r/m;
    limit_conn_zone $http_x_real_ip zone=connections_per_client:10m;

    include /etc/nginx/conf.d/*.conf;
}
