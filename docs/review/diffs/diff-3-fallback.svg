<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 295" font-family="Menlo,Consolas,monospace"><rect width="928" height="295" fill="#ffffff"/><text x="16" y="30" font-size="14" font-weight="bold" fill="#111827">变更 3 · AI 失败静默降级 → 显式提示</text><rect x="16" y="64" width="440" height="28" rx="6" fill="#b91c1c"/><text x="26" y="83" font-size="12" font-weight="bold" fill="#ffffff">改前 · material_generator.py::_safe</text><rect x="16" y="98" width="440" height="201" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/><text x="26" y="116" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">except ProviderError as exc:</text><text x="26" y="133" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    result = fallback_call()</text><text x="26" y="150" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve"></text><text x="26" y="167" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    record_outcome(</text><text x="26" y="184" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">        status=&quot;rule_fallback&quot;, ...)</text><text x="26" y="201" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    return result</text><text x="26" y="218" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve"></text><text x="26" y="235" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve"># 用户拿到的是模板拼接，但界面</text><text x="26" y="252" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve"># 与普通 AI 结果看起来一样</text><rect x="472" y="64" width="440" height="28" rx="6" fill="#15803d"/><text x="482" y="83" font-size="12" font-weight="bold" fill="#ffffff">改后 · material_generator.py::_safe</text><rect x="472" y="98" width="440" height="201" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/><text x="482" y="116" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">except ProviderError as exc:</text><text x="482" y="133" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    result = fallback_call()</text><text x="482" y="150" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">    result = result.model_copy(update={</text><text x="482" y="167" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">        &quot;warnings&quot;: [*result.warnings,</text><text x="482" y="184" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">            &quot;AI 生成未通过证据校验或模型不可用，</text><text x="482" y="201" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">             已回退到确定性模板。/ AI generation</text><text x="482" y="218" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">             failed validation; deterministic</text><text x="482" y="235" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">             template was used instead.&quot;]})</text><text x="482" y="252" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    record_outcome(</text><text x="482" y="269" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">        status=&quot;rule_fallback&quot;, ...)</text><text x="482" y="286" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">    return result   # UI 可见「已回退」</text></svg>