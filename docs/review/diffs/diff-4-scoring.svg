<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 278" font-family="Menlo,Consolas,monospace"><rect width="928" height="278" fill="#ffffff"/><text x="16" y="30" font-size="14" font-weight="bold" fill="#111827">变更 4 · 匹配分数修复（job_analysis_service.py）</text><text x="16" y="48" font-size="11" fill="#6b7280">唯一断言 breakdown 的测试 test_stage3_matching::required_skill_match==20 不受影响</text><rect x="16" y="64" width="440" height="28" rx="6" fill="#b91c1c"/><text x="26" y="83" font-size="12" font-weight="bold" fill="#ffffff">改前 · 两处失真</text><rect x="16" y="98" width="440" height="184" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/><text x="26" y="116" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">def _relevance_score(job, confirmed):</text><text x="26" y="133" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    ...</text><text x="26" y="150" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve">    # 只取单条最高分：加更多相关经历</text><text x="26" y="167" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve">    # 也不会涨分</text><text x="26" y="184" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">    return round(max(values, default=0) * 25)</text><text x="26" y="201" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve"></text><text x="26" y="218" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    breakdown = {</text><text x="26" y="235" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">        ...</text><text x="26" y="252" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">        &quot;qualification_coverage&quot;: 0,  # 恒为 0</text><text x="26" y="269" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    }</text><rect x="472" y="64" width="440" height="28" rx="6" fill="#15803d"/><text x="482" y="83" font-size="12" font-weight="bold" fill="#ffffff">改后 · 平均值 + 移除死维度</text><rect x="472" y="98" width="440" height="184" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/><text x="482" y="116" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">def _relevance_score(job, confirmed):</text><text x="482" y="133" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    ...</text><text x="482" y="150" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve">    # 对全部已确认经历取平均：</text><text x="482" y="167" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve">    # 证据越相关分数越高</text><text x="482" y="184" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">    return round(sum(values) / len(values) * 25)</text><text x="482" y="201" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve"></text><text x="482" y="218" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    breakdown = {</text><text x="482" y="235" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">        ...</text><text x="482" y="252" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">        # qualification_coverage 已移除</text><text x="482" y="269" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    }</text></svg>