<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 346" font-family="Menlo,Consolas,monospace"><rect width="928" height="346" fill="#ffffff"/><text x="16" y="30" font-size="14" font-weight="bold" fill="#111827">变更 2 · CV 解析兜底：中文/通用标题不再丢内容</text><rect x="16" y="64" width="440" height="28" rx="6" fill="#b91c1c"/><text x="26" y="83" font-size="12" font-weight="bold" fill="#ffffff">改前 · mock_extractor.py（节选）</text><rect x="16" y="98" width="440" height="252" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/><text x="26" y="116" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve"># 旧正则：只认英文特定标题</text><text x="26" y="133" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">r&quot;^(PERSONAL SKILLS|EDUCATION|</text><text x="26" y="150" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">r&quot;  .*WORK(?:ING)? EXPERIENCE|</text><text x="26" y="167" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">r&quot;  (?:WORK|INTERNSHIP|EMPLOYMENT).*|</text><text x="26" y="184" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">r&quot;  QUANT INSIGHT EXPERIENCE|...)$&quot;</text><text x="26" y="201" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve"></text><text x="26" y="218" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">for line in raw:</text><text x="26" y="235" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    match = SECTION_RE.match(line)</text><text x="26" y="252" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">    if match:            # 含日期的内容行</text><text x="26" y="269" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">        ...              # 也会被当成标题</text><text x="26" y="286" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">for section, lines in sections:</text><text x="26" y="303" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    if section == &quot;GENERAL&quot;:</text><text x="26" y="320" font-size="11.5" fill="#b91c1c" font-weight="bold" xml:space="preserve">        continue         # 整段直接丢弃</text><rect x="472" y="64" width="440" height="28" rx="6" fill="#15803d"/><text x="482" y="83" font-size="12" font-weight="bold" fill="#ffffff">改后 · mock_extractor.py（节选）</text><rect x="472" y="98" width="440" height="252" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/><text x="482" y="116" font-size="11.5" fill="#6b7280" font-weight="normal" xml:space="preserve"># 新增英文通用前缀 + 中文标题</text><text x="482" y="133" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">r&quot;  ...|PROFESSIONAL|CAREER|RESEARCH|</text><text x="482" y="150" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">r&quot;     PROJECT|EXPERIENCE).*|&quot;</text><text x="482" y="167" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">r&quot;  工作经历|实习经历|教育经历|项目经历|</text><text x="482" y="184" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">r&quot;  研究经历|竞赛.*|志愿.*|课外活动.*$</text><text x="482" y="201" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve"></text><text x="482" y="218" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">for line in raw:</text><text x="482" y="235" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    match = SECTION_RE.match(line)</text><text x="482" y="252" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">    if match and not DATE_RE.search(line):</text><text x="482" y="269" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">        ...   # 标题不带日期，内容行不误判</text><text x="482" y="286" font-size="11.5" fill="#1f2937" font-weight="normal" xml:space="preserve">    if section == &quot;GENERAL&quot;:</text><text x="482" y="303" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">        if any(DATE_RE.search(l) for l in lines):</text><text x="482" y="320" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">            records.extend(_split_section(&quot;EXPERIENCE&quot;,…))</text><text x="482" y="337" font-size="11.5" fill="#15803d" font-weight="bold" xml:space="preserve">            continue  # 有日期的兜底内容不再丢</text></svg>