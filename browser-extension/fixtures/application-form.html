<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>ApplyEase local fixture</title></head>
<body><main>
  <h1>Local internship application fixture</h1>
  <form id="application-form">
    <label for="full-name">Full name *</label><input id="full-name" name="fullName" type="text">
    <label for="motivation">Why are you interested in this role?</label><textarea id="motivation" name="motivation" maxlength="300"></textarea>
    <label for="track">Preferred track</label><select id="track" name="track"><option value="quant">Quantitative Research</option><option value="software">Software Engineering</option></select>
    <label for="password">Password</label><input id="password" name="password" type="password">
    <label for="resume">Resume upload</label><input id="resume" name="resume" type="file">
    <label for="authorization">Work authorization</label><input id="authorization" name="authorization" type="text">
    <button id="submit" type="submit">Submit application</button>
  </form>
</main></body></html>
