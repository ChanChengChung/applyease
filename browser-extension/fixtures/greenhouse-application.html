<!doctype html><html><body><div id="grnhse_app"><form id="application_form">
  <div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" data-qa="first_name"></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" data-qa="email"></div>
  <fieldset class="field" data-qa="custom-question"><legend>Preferred work arrangement</legend>
    <label><input type="radio" name="arrangement" value="remote">Remote</label>
    <label><input type="radio" name="arrangement" value="office">Office</label>
  </fieldset>
  <div class="field"><label for="cover_letter">Why are you interested?</label><textarea id="cover_letter" name="cover_letter"></textarea></div>
  <button type="submit" data-qa="submit">Submit application</button>
</form></div></body></html>
