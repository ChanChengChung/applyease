<!doctype html><html><body><main><form class="application-form">
  <div class="application-field"><label for="name">Full name *</label><input id="name" name="name" required></div>
  <div class="application-field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="application-field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="application-question"><label for="portfolio">Portfolio URL</label><input id="portfolio" name="urls[Portfolio]" type="url"></div>
  <div class="application-question"><label for="motivation">Why do you want this internship? *</label><textarea id="motivation" name="comments" maxlength="500"></textarea></div>
  <div class="application-question"><label>Preferred office *</label><select name="office"><option value="">Select</option><option value="hk">Hong Kong</option><option value="sg">Singapore</option></select></div>
  <fieldset class="application-question"><legend>Available this summer? *</legend><label><input type="radio" name="available" value="yes">Yes</label><label><input type="radio" name="available" value="no">No</label></fieldset>
  <div class="application-field"><label for="resume">Resume *</label><input id="resume" name="resume" type="file"></div>
  <label><input type="checkbox" name="consent">I agree to data processing</label>
  <button type="submit">Submit application</button>
</form></main></body></html>
